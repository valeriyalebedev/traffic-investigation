<section class="kpi-row" aria-label="Key metrics">
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon--requests" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="kpi-content">
      <span class="kpi-value">{{ totalRequests() !== null ? (totalRequests() | number) : '—' }}</span>
      <span class="kpi-label">Requests</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon kpi-icon--ips" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M1 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="18" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M19 14c2.2.5 4 2 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="kpi-content">
      <span class="kpi-value">{{ uniqueIps() !== null ? (uniqueIps() | number) : '—' }}</span>
      <span class="kpi-label">Unique source IPs</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon kpi-icon--agents" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 18v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="kpi-content">
      <span class="kpi-value">{{ uniqueUserAgents() !== null ? (uniqueUserAgents() | number) : '—' }}</span>
      <span class="kpi-label">User-Agent values</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon kpi-icon--findings" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
        <path d="M12 2L2 20h20L12 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1" fill="currentColor"/>
      </svg>
    </div>
    <div class="kpi-content">
      <span class="kpi-value">—</span>
      <span class="kpi-label">Investigation findings</span>
    </div>
  </div>
</section>
