<section class="analytics-row" aria-label="Traffic analytics">
  <div class="panel panel--traffic">
    <div class="panel-header">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M3 17V7l4 3 4-6 4 4 2-2" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h3 class="panel-title">
          Traffic over time
          <button class="info-anchor" type="button" aria-label="Chart information">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M8 7.2V11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="8" cy="5.2" r="0.7" fill="currentColor"/>
            </svg>
            <span class="info-tooltip" role="tooltip">This chart displays requests from all source IPs over the selected dataset period. The time interval is automatically adjusted to keep the chart readable as dataset size increases. Each point represents the total number of requests within its time interval. Original log records remain unchanged and are available for source investigation.</span>
          </button>
        </h3>
        <p class="panel-subtitle">Requests per {{ intervalLabel() }} · All sources · UTC</p>
      </div>
    </div>
    @if (hasData()) {
      <div class="chart-container">
        <svg class="traffic-chart"
             [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight"
             role="img"
             aria-label="Traffic over time line chart">

          <!-- Y-axis label -->
          <text class="axis-title"
                [attr.x]="12"
                [attr.y]="(chartHeight - paddingBottom) / 2"
                text-anchor="middle"
                [attr.transform]="'rotate(-90, 12, ' + (chartHeight - paddingBottom) / 2 + ')'">Requests</text>

          <!-- Horizontal grid lines and Y tick labels -->
          @for (tick of yTicks(); track tick) {
            <line class="grid-line"
                  [attr.x1]="paddingLeft" [attr.x2]="chartWidth - paddingRight"
                  [attr.y1]="yTickY(tick)" [attr.y2]="yTickY(tick)"/>
            <text class="axis-label axis-label--y"
                  [attr.x]="paddingLeft - 6" [attr.y]="yTickY(tick) + 3"
                  text-anchor="end">{{ tick }}</text>
          }

          <!-- Area fill -->
          <path class="chart-area" [attr.d]="areaPath()"/>

          <!-- Line -->
          <path class="chart-line" [attr.d]="linePath()"/>

          <!-- Invisible hit areas + visible dots -->
          @for (pt of points(); track pt.bucket.start.getTime()) {
            <circle class="chart-dot"
                    [attr.cx]="pt.x" [attr.cy]="pt.y" r="2.5"
                    [class.chart-dot--active]="activePoint()?.bucket.start.getTime() === pt.bucket.start.getTime()"/>
            <circle class="chart-hit"
                    [attr.cx]="pt.x" [attr.cy]="pt.y" r="12"
                    (mouseenter)="onPointEnter(pt)"
                    (mouseleave)="onPointLeave()"
                    (focus)="onPointEnter(pt)"
                    (blur)="onPointLeave()"
                    tabindex="0"
                    [attr.aria-label]="(pt.bucket.start | date:'d MMM yyyy, HH:mm':'UTC') + ' – ' + (pt.bucket.end | date:'HH:mm':'UTC') + ': ' + pt.bucket.count + ' requests'"/>
          }

          <!-- X-axis labels -->
          @for (label of xLabels(); track label.x) {
            <text class="axis-label axis-label--x"
                  [attr.x]="label.x"
                  [attr.y]="chartHeight - 8"
                  text-anchor="middle">{{ label.date | date:xLabelFormat():'UTC' }}</text>
          }

          <!-- Tooltip -->
          @if (activePoint(); as ap) {
            <g class="tooltip-group" [attr.transform]="'translate(' + tooltipX() + ',' + tooltipY() + ')'">
              @if (tooltipAbove()) {
                <rect class="tooltip-bg" x="-80" y="-32" width="160" height="30" rx="4"/>
                <text class="tooltip-text" text-anchor="middle" y="-20">{{ ap.bucket.start | date:'d MMM, HH:mm':'UTC' }} – {{ ap.bucket.end | date:'HH:mm':'UTC' }}</text>
                <text class="tooltip-text tooltip-text--bold" text-anchor="middle" y="-9">{{ ap.bucket.count | number }} requests</text>
              } @else {
                <rect class="tooltip-bg" x="-80" y="2" width="160" height="30" rx="4"/>
                <text class="tooltip-text" text-anchor="middle" y="14">{{ ap.bucket.start | date:'d MMM, HH:mm':'UTC' }} – {{ ap.bucket.end | date:'HH:mm':'UTC' }}</text>
                <text class="tooltip-text tooltip-text--bold" text-anchor="middle" y="25">{{ ap.bucket.count | number }} requests</text>
              }
            </g>
          }
        </svg>
      </div>
    } @else {
      <div class="panel-empty">
        <p>Load a log file to see traffic distribution</p>
      </div>
    }
  </div>

  <div class="panel panel--status">
    <div class="panel-header">
      <h3 class="panel-title">HTTP status codes</h3>
    </div>
    <div class="panel-empty">
      <p>Load a log file to see status code breakdown</p>
    </div>
  </div>
</section>
